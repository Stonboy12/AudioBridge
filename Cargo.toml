[workspace]
resolver = "2"
members = [
    "crates/audio-types",
    "crates/audio-codec",
    "crates/audio-buffer",
    "crates/audio-processing",
    "crates/audio-capture",
    "crates/audio-pipeline",
    "crates/streaming-protocol",
    "crates/networking",
    "crates/config",
    "crates/diagnostics",
    "crates/audiobridge-sender",
    "crates/audiobridge-receiver-jni",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AudioBridge Engineering Team"]
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tempfile = "3.10"
byteorder = "1.5"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
